<title>農場留言牆 | Blueberry Crest</title>
<style>
:root { color-scheme: light; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; color: #252541; background: #f8f7fb; --ink: #252541; --soft: #5a5870; --line: #dedbe9; --plum: #51417c; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
.wrap { width: min(1160px, 100% - clamp(28px, 7vw, 88px)); margin-inline: auto; }
.top { border-bottom: 1px solid #e9e5ef; background: #fff; }
.bar { display: flex; align-items: center; justify-content: space-between; min-height: 64px; gap: 10px; }
.home, .subtle, .primary { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; gap: 8px; }
.home { color: var(--plum); text-decoration: none; font-weight: 740; }
.home:hover { text-decoration: underline; }
button, input, textarea { font: inherit; }
button { border: 1px solid transparent; border-radius: 10px; cursor: pointer; font-weight: 700; }
button:disabled { opacity: .6; cursor: wait; }
.subtle { padding: 7px 12px; color: var(--plum); background: #fff; border: 1px solid var(--line); }
.subtle:hover { background: #f0ebf8; }
.primary { padding: 9px 18px; color: #fff; background: var(--plum); }
.primary:hover { background: #3d3061; }
:focus-visible { outline: 3px solid #8263be; outline-offset: 3px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .9fr); min-height: 298px; margin-block: clamp(16px, 4vw, 42px) clamp(26px, 5vw, 54px); border-radius: 24px; overflow: hidden; background: #2c2547; color: #fff; }
.hero-copy { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: clamp(22px, 5vw, 62px); background: radial-gradient(ellipse at bottom right, #493664, transparent 65%); }
.hero img { display: block; width: 100%; height: 100%; max-height: 420px; object-fit: cover; object-position: center 51%; }
h1, h2 { margin: 0; line-height: 1.25; }
h1 { font-size: clamp(2rem, 5vw, 3.55rem); font-weight: 800; letter-spacing: -.035em; }
.hero p { margin: 12px 0 21px; color: #ede6f8; }
.hero .primary { background: #f3ebff; color: #39265a; }
.hero .primary:hover { background: #fff; }
.board { padding-bottom: 32px; }
.board-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.board-head h2 { font-size: clamp(1.25rem, 2.5vw, 1.6rem); }
.posts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }

time, .note, .upload-name, footer { color: var(--soft); font-size: .875rem; }

.post p { margin: 10px 0 0; white-space: pre-wrap; }
.photo-tile { position: relative; width: 100%; aspect-ratio: 1.55; border: 0; border-radius: 0; padding: 0; display: block; overflow: hidden; background: #eae4f2; }
.photo-tile:focus-visible { outline-offset: -4px; }
.photo-tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
.photo-unavailable { display: block; padding: 12px 15px; border-bottom: 1px solid var(--line); color: var(--soft); }

.status:empty { display: none; }

footer a { color: var(--plum); }
dialog { width: min(500px, calc(100% - 26px)); max-height: calc(100% - 26px); margin: auto; padding: clamp(14px, 3vw, 23px); border: 1px solid var(--line); border-radius: 18px; background: #fff; color: var(--ink); box-shadow: 0 12px 45px #2b244b47; }
dialog::backdrop { background: #241c3db3; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.dialog-head h2 { font-size: 1.35rem; }
label { display: block; margin-top: 12px; font-weight: 700; }
input:not([type=file]), textarea { display: block; width: 100%; min-height: 44px; margin-top: 4px; padding: 8px 10px; border: 1px solid #bcb7cb; border-radius: 9px; background: #fcfbff; color: inherit; }
textarea { resize: vertical; }
.upload { position: relative; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; min-height: 54px; padding: 8px 12px; border: 1px dashed #aca0c6; border-radius: 10px; background: #f8f4fe; color: var(--plum); cursor: pointer; }
.upload input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.upload:focus-within { outline: 3px solid #8263be; outline-offset: 3px; }
.upload-name { max-width: 100%; overflow-wrap: anywhere; }
#photo-preview { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
#photo-preview img { width: 65px; height: 54px; object-fit: cover; border-radius: 7px; }
.note { margin: 8px 0 0; }
.actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#publish { width: 100%; margin-top: 12px; }
#photo-dialog { width: min(880px, calc(100% - 24px)); }
#full-photo { display: block; width: 100%; max-height: 75dvh; object-fit: contain; }
@media (max-width: 850px) { .posts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 590px) {
  .hero { grid-template-columns: 1fr; min-height: 0; }
  .hero img { height: clamp(125px, 39vw, 186px); }
  .hero-copy { padding: 18px; }
  .hero p { margin: 8px 0 13px; }
  .posts { grid-template-columns: minmax(0, 1fr); gap: 12px; }
}

<body>
<header class="top">
  <div class="wrap bar">
    <a class="home" href="./"><span aria-hidden="true">‹</span> 農場首頁</a>
    <button id="manage" class="subtle" type="button">管理員登入</button>
  </div>
</header>
<main class="wrap">
  <section class="hero" aria-labelledby="wall-title">
    <div class="hero-copy">
      <h1 id="wall-title">農場留言牆</h1>
      <p>分享採果相片、工作感想同農場建議。</p>
      <button class="primary" type="button" data-open-compose><span aria-hidden="true">＋</span> 寫留言</button>
    </div>
    <img src="farm-wall-blueberries.webp" width="850" height="650" alt="" fetchpriority="high">
  </section>
  <section class="board" aria-labelledby="posts-title">
    <div class="board-head">
      <h2 id="posts-title">最新留言</h2>
      <button id="refresh" class="subtle" type="button">更新留言</button>
    </div>
    <p id="publish-notice" class="status" role="status"></p>
    <p id="feed-status" class="status" role="status"></p>
    <div id="empty-feed" class="empty" hidden>
      <span class="empty-icon" aria-hidden="true">🫐</span>

      <p>分享一張相，或者講吓今日喺農場嘅感想。</p>
      <button class="subtle" type="button" data-open-compose>寫第一則留言</button>
    </div>
    <div id="posts" class="posts"></div>
    <button id="more" class="subtle" type="button" hidden>載入更多留言</button>
  </section>
</main>
<footer class="wrap"><a href="https://unsplash.com/photos/a-close-up-of-ripe-blueberries-on-a-bush-L3Eoy3-XFBA">藍莓相片 · Eric Prouzet</a></footer>
<dialog id="compose-dialog" aria-labelledby="compose-title">
  <div class="dialog-head">
    <h2 id="compose-title">寫留言</h2>
    <button class="subtle" id="close-compose" type="button">關閉</button>

  <form id="compose">

    <label class="upload">
      <span>附加相片（選填，一張）</span>
      <span id="photo-name" class="upload-name"></span>
      <input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" aria-describedby="photo-help">
    </label>
    <div id="photo-preview" hidden>
      <img id="photo-thumb" alt="待發佈相片預覽">
      <button class="subtle" id="remove-photo" type="button">移除相片</button>
    </div>
    <p id="photo-help" class="note">留言同相片會即時公開。請先得到相中人物同意。</p>
    <button id="publish" class="primary" type="submit">發佈留言</button>
    <p id="compose-status" class="status" role="status"></p>
  </form>
</dialog>
<dialog id="photo-dialog" aria-labelledby="photo-title">
  <div class="dialog-head">
    <h2 id="photo-title">留言相片</h2>
    <button class="subtle" id="close-photo" type="button">關閉</button>
  </div>
  <img id="full-photo" alt="留言相片">
</dialog>
<dialog id="admin-dialog" aria-labelledby="admin-title">

  <form id="login">
    <label for="email">電郵</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">密碼</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <p id="login-status" class="status" role="status"></p>
    <div class="actions"><button type="submit" class="primary">登入</button><button class="subtle" id="cancel-login" type="button">取消</button></div>
  </form>
</dialog>
<dialog id="delete-dialog" aria-labelledby="delete-title">
  <h2 id="delete-title">刪除留言？</h2>
  <p>留言同附上嘅相片會一併刪除。</p>
  <form method="dialog" class="actions"><button class="subtle" value="cancel" autofocus>取消</button><button class="delete" value="delete">刪除</button></form>
</dialog>
<script>
'use strict';
const endpoint = 'https://batsjsznudkeqaaijxsg.supabase.co';
const publishableKey = "sb_publishable_o4kcn0Rr0zSNnuMjyZ75KQ_9pKWrMN_";
const byId = id => document.getElementById(id);
const form = byId('compose');
const composer = byId('compose-dialog');
const fileInput = byId('photo');
const draftPreview = byId('photo-preview');
const thumbnail = byId('photo-thumb');
const photoDialog = byId('photo-dialog');
const fullPhoto = byId('full-photo');
const emptyFeed = byId('empty-feed');
const feed = byId('posts');
const more = byId('more');
const refresh = byId('refresh');
const manage = byId('manage');
const login = byId('login');
const dialog = byId('admin-dialog');
const confirmation = byId('delete-dialog');
const dateFormat = new Intl.DateTimeFormat('zh-HK', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Australia/Brisbane' });
const photoLimit = 327680;
let cursor;
let session;
let loading = false;
let reloadRequested = false;
let draftId = crypto.randomUUID();
let previewUrl;

function status(id, text, error = false) {
  const node = byId(id);
  node.textContent = text;
  node.dataset.error = error;
}

async function request(path, body, token) {
  const headers = { apikey: publishableKey, 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 18000);
  let response, result;
  try {
    response = await fetch(endpoint + path, {
      method: 'POST', headers, body: JSON.stringify(body), signal: controller.signal
    });
    result = await response.json();
  } finally {
    clearTimeout(timeout);
  }
  if (!response.ok) {
    const error = new Error(result.message || result.msg || 'request_failed');
    error.status = response.status;
    throw error;
  }
  return result;
}

function rpc(name, body, token) {
  return request('/rest/v1/rpc/farm_wall_' + name, body, token);
}

async function attachPhoto(tile, id) {
  try {
    const data = await rpc('photo', { post_id: id });
    if (!data) {
      tile.remove();
      return;
    }
    const image = tile.firstElementChild;
    image.src = 'data:image/jpeg;base64,' + data;
    await image.decode();
    image.hidden = false;
    tile.disabled = false;
  } catch {
    const message = document.createElement('span');
    message.className = 'photo-unavailable';
    message.textContent = '暫時載入唔到相片。';
    tile.replaceWith(message);
  }
}

const photoObserver = typeof IntersectionObserver === 'function' ? new IntersectionObserver(entries => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    photoObserver.unobserve(entry.target);
    attachPhoto(entry.target, entry.target.dataset.photo);
  }
}, { rootMargin: '250px' }) : null;

function addPost(post) {
  const article = document.createElement('article');
  article.className = 'post';
  const body = document.createElement('div');
  body.className = 'post-body';
  const header = document.createElement('header');
  const avatar = document.createElement('span');
  avatar.className = 'avatar';
  avatar.setAttribute('aria-hidden', 'true');
  avatar.textContent = Array.from(post.display_name.trim())[0] || '🫐';
  const author = document.createElement('div');
  author.className = 'author';
  const name = document.createElement('strong');
  const time = document.createElement('time');
  const text = document.createElement('p');
  name.textContent = post.display_name;
  name.dir = 'auto';
  time.dateTime = post.created_at;
  time.textContent = dateFormat.format(new Date(post.created_at));
  text.textContent = post.message;
  text.dir = 'auto';
  author.append(name, time);
  header.append(avatar, author);
  body.append(header, text);
  if (post.has_photo) {
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'photo-tile';
    tile.dataset.photo = post.id;
    tile.disabled = true;
    tile.setAttribute('aria-label', '放大' + post.display_name + '嘅留言相片');
    const image = document.createElement('img');
    image.alt = '留言附圖';
    image.hidden = true;
    tile.append(image);
    tile.addEventListener('click', () => {
      fullPhoto.src = image.src;
      photoDialog.showModal();
    });
    article.append(tile);
    if (photoObserver) photoObserver.observe(tile);
    else attachPhoto(tile, post.id);
  }
  const remove = document.createElement('button');
  remove.type = 'button';
  remove.className = 'delete';
  remove.textContent = '刪除留言';
  remove.hidden = !session;
  remove.addEventListener('click', () => deletePost(post.id, article));
  body.append(remove);
  article.append(body);
  feed.append(article);
}

async function loadPosts(reset = true) {
  if (loading) {
    if (reset) reloadRequested = true;
    return;
  }
  loading = true;
  refresh.disabled = more.disabled = true;
  status('feed-status', '載入緊留言…');
  try {
    const filters = reset || !cursor ? {} : { before_time: cursor.created_at, before_id: cursor.id };
    const posts = await rpc('list', filters);
    if (reset) {
      for (const frame of feed.querySelectorAll('[data-photo]')) photoObserver?.unobserve(frame);
      feed.replaceChildren();
    }
    posts.forEach(addPost);
    cursor = posts.at(-1);
    more.hidden = posts.length < 12;
    emptyFeed.hidden = feed.children.length > 0;
    status('feed-status', '');
  } catch {
    emptyFeed.hidden = true;
    status('feed-status', '載入唔到留言，請再撳「更新留言」。', true);
  } finally {
    loading = false;
    refresh.disabled = more.disabled = false;
    if (reloadRequested) {
      reloadRequested = false;
      loadPosts();
    }
  }
}

async function preparePhoto(file) {
  if (!file) return null;
  if (file.size > 20 * 1024 * 1024) throw new Error('photo_size');
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    try { await img.decode(); } catch { throw new Error('photo_format'); }
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    if (!context || !img.naturalWidth || !img.naturalHeight) throw new Error('photo_format');
    for (const [edge, quality] of [[1152, .8], [960, .72], [720, .64], [560, .6]]) {
      const scale = Math.min(1, edge / Math.max(img.naturalWidth, img.naturalHeight));
      canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(img, 0, 0, canvas.width, canvas.height);
      const encoded = canvas.toDataURL('image/jpeg', quality);
      const prefix = 'data:image/jpeg;base64,';
      if (!encoded.startsWith(prefix)) throw new Error('photo_format');
      const base64 = encoded.slice(prefix.length);
      const padding = base64.endsWith('==') ? 2 : Number(base64.endsWith('='));
      if (base64.length / 4 * 3 - padding <= photoLimit) return base64;
    }
    throw new Error('photo_size');
  } finally {
    URL.revokeObjectURL(url);
  }
}

function updateDraftPreview() {
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  thumbnail.removeAttribute('src');
  thumbnail.hidden = true;
  const file = fileInput.files[0];
  byId('photo-name').textContent = file ? file.name : '';
  draftPreview.hidden = !file;
  previewUrl = file ? URL.createObjectURL(file) : undefined;
  if (previewUrl) thumbnail.src = previewUrl;
}

thumbnail.addEventListener('load', () => { thumbnail.hidden = false; });
fileInput.addEventListener('change', updateDraftPreview);
byId('remove-photo').addEventListener('click', () => {
  fileInput.value = '';
  draftId = crypto.randomUUID();
  updateDraftPreview();
  fileInput.focus();
});
document.querySelectorAll('[data-open-compose]').forEach(button => {
  button.addEventListener('click', () => {
    status('publish-notice', '');
    composer.showModal();
  });
});
byId('close-compose').addEventListener('click', () => composer.close());
composer.addEventListener('cancel', event => {
  if (byId('publish').disabled) event.preventDefault();
});
byId('close-photo').addEventListener('click', () => photoDialog.close());
photoDialog.addEventListener('close', () => fullPhoto.removeAttribute('src'));

form.addEventListener('input', () => { draftId = crypto.randomUUID(); });
form.addEventListener('submit', async event => {
  event.preventDefault();
  const button = byId('publish');
  if (button.disabled) return;
  const name = byId('name').value.trim();
  const message = byId('message').value.trim();
  if (!name || !message) {
    status('compose-status', '請填寫名字同留言。', true);
    return;
  }
  byId('close-compose').disabled = true;
  for (const control of form.elements) control.disabled = true;
  status('compose-status', '發佈緊…');
  try {
    const photo = await preparePhoto(byId('photo').files[0]);
    await rpc('post', { post_id: draftId, name_text: name, message_text: message, photo_base64: photo });
    form.reset();
    draftId = crypto.randomUUID();
    updateDraftPreview();
    status('compose-status', '');
    composer.close();
    status('publish-notice', '已發佈留言。');
    loadPosts();
  } catch (error) {
    const messages = {
      photo_format: '讀唔到呢張相，請試用 JPG、PNG 或 WebP。',
      photo_size: '相片太大，請揀一張細啲嘅相。',
      wall_rate_limit: '留言太頻密，請遲啲再試。',
      wall_full: '留言牆已滿，請稍後再試。'
    };
    status('compose-status', messages[error.message] || '發佈未能確認，請再試。', true);
  } finally {
    for (const control of form.elements) control.disabled = false;
    byId('close-compose').disabled = false;
  }
});

function setSession(token) {
  session = token;
  manage.textContent = token ? '管理員登出' : '管理員登入';
  feed.querySelectorAll('.delete').forEach(button => { button.hidden = !token; });
}

async function deletePost(id, article) {
  if (!session || confirmation.open) return;
  confirmation.returnValue = 'cancel';
  confirmation.addEventListener('close', async () => {
    if (confirmation.returnValue !== 'delete' || !session) return;
    const button = article.querySelector('.delete');
    button.disabled = true;
    try {
      await rpc('delete', { post_id: id }, session);
      status('feed-status', '已刪除留言。');
      const frame = article.querySelector('[data-photo]');
      if (frame) photoObserver?.unobserve(frame);
      article.remove();
      emptyFeed.hidden = feed.children.length > 0;
    } catch (error) {
      if (error.status === 401 || error.status === 403) setSession(null);
      status('feed-status', '刪除未完成，請確認管理員登入後再試。', true);
    } finally {
      button.disabled = false;
    }
  }, { once: true });
  confirmation.showModal();
}

manage.addEventListener('click', () => {
  if (session) {
    setSession(null);
    return;
  }
  status('login-status', '');
  dialog.showModal();
});
byId('cancel-login').addEventListener('click', () => dialog.close());
dialog.addEventListener('close', () => { byId('password').value = ''; });
login.addEventListener('submit', async event => {
  event.preventDefault();
  const button = login.querySelector('[type=submit]');
  if (button.disabled) return;
  button.disabled = true;
  status('login-status', '登入緊…');
  try {
    const auth = await request('/auth/v1/token?grant_type=password', {
      email: byId('email').value.trim(), password: byId('password').value
    });
    const admin = await rpc('is_admin', {}, auth.access_token);
    if (!dialog.open) return;
    if (!admin) {
      status('login-status', '呢個帳戶冇留言牆管理權限。', true);
      return;
    }
    setSession(auth.access_token);
    dialog.close();
  } catch {
    status('login-status', '登入失敗，請核對電郵同密碼。', true);
  } finally {
    byId('password').value = '';
    button.disabled = false;
  }
});
refresh.addEventListener('click', () => loadPosts());
more.addEventListener('click', () => loadPosts(false));
loadPosts();
</script>
</body>
</html>
